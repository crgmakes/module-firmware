; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = servo_v10

[env]
extra_scripts = pre:${PROJECT_DIR}/scripts/surpress_register_warnings.py

[env:switch]
lib_deps = ${env.lib_deps}
build_flags = 
	${env.build_flags}
	-DMODULE_VERSION=1.1
	-DMODULE_HW_ID=0x88
	-DMODULE_ADDRESS=MODULE_ADDRESS_SWITCH
	-DMODULE_ADDR_PIN_0=PIN_PB4
	-DMODULE_ADDR_PIN_1=PIN_PB5
	-DMODULE_CHANNELS=1
	-DSWITCH_1_PIN=PIN_PA4
	-I src/relay/
build_src_filter = +<switch/*> +<core/*> -<.git/>
platform_packages = platformio/tool-cppcheck@^1.21100.241030

[env:gpio]
lib_deps = ${env.lib_deps}
build_flags = 
	${env.build_flags}
	-DMODULE_VERSION=1.0
	-DMODULE_HW_ID=0x88
	-DMODULE_ADDRESS=MODULE_ADDRESS_GPIO
	-DMODULE_ADDR_PIN_0=PIN_PB4
	-DMODULE_ADDR_PIN_1=PIN_PB5
	-DMODULE_CHANNELS=16
	-I src/gpio/
build_src_filter = +<gpio/*> +<core/*> -<.git/>
platform_packages = platformio/tool-cppcheck@^1.21100.241030

[env:servo1_1]
build_type = debug
platform = atmelmegaavr
framework = arduino
board = ATtiny1616
board_build.f_cpu = 10000000L
board_hardware.oscillator = internal
build_unflags = 
upload_protocol = serialupdi
;upload_protocol = pickit5_updi
lib_deps = ${env.lib_deps}
build_flags = 
	${env.build_flags}
	-DARDUINO_AVR_ATtiny1616
	-DMODULE_VERSION=1.1
	-DMODULE_HW_ID=0x88
	-DMODULE_ADDRESS=MODULE_ADDRESS_SERVO
	-DMODULE_ADDR_PIN_0=PIN_PB4
	-DMODULE_ADDR_PIN_1=PIN_PB5
	-DMODULE_CHANNELS=3
	-DSERVO_1_PIN=PIN_PA7
	-DSERVO_2_PIN=PIN_PA6
	-DSERVO_3_PIN=PIN_PA5
	-DSERVO_4_PIN=PIN_PA4
	-DCONFIG_PWM_16BIT=1
build_src_filter = +<servo/*> +<core/*> -<.git/>
;upload_command = /Users/tsasala/Downloads/avrdude8.1/bin/avrdude -C /Users/tsasala/Downloads/avrdude8.1/etc/avrdude.conf -c pickit5_updi -pATtiny1616 -Pusbmodem41302 -U flash:w:$SOURCE:i
platform_packages = platformio/tool-cppcheck@^1.21100.241030

[env:set_fuses]
upload_protocol = ${env:upload_protocol}
upload_flags = 
board_hardware.bod = 2.7v
board_hardware.eesave = yes
board_hardware.updipin = updi
platform_packages = platformio/tool-cppcheck@^1.21100.241030

[env:nucleo_c031c6]
build_type = debug
platform = ststm32
board = nucleo_c031c6
platform_packages = 
	tool-openocd@symlink://packages/xpack-openocd-0.12.0-7
	platformio/tool-cppcheck@^1.21100.241030
framework = arduino
upload_protocol = stlink
lib_deps = 
	; https://github.com/adafruit/Adafruit_BusIO.git
build_flags = 
	${env.build_flags}
	-Os
	-specs=nano.specs
	-DMODULE_VERSION=0
	-DMODULE_HW_ID=0x88
	-DMODULE_ADDRESS=MODULE_ADDRESS_SERVO
	-DMODULE_ADDR_PIN_0=PB_4
	-DMODULE_ADDR_PIN_1=PB_5
	-DMODULE_I2C_SCL=PB8
	-DMODULE_I2C_SDA=PB9
	-DMODULE_CHANNELS=4
	-DSERVO_1_PIN=PA6
	-DSERVO_2_PIN=PA7
	-DSERVO_3_PIN=PB0
	-DSERVO_4_PIN=PC7
	-DLED_1_PIN=-1
	-DLED_2_PIN=-1
	-DLED_3_PIN=-1
	-DLED_4_PIN=-1
	-DLED_BUILTIN=PA5
	-DMODULE_RX_PIN=PA3
	-DMODULE_TX_PIN=PA2
	-DCONFIG_UART_DEBUG=1
	-D HAL_SPI_MODULE_DISABLED
	-D HAL_ADC_MODULE_DISABLED
	-D HAL_RTC_MODULE_DISABLED
	-D HAL_DAC_MODULE_DISABLED
	-D HAL_EXTI_MODULE_DISABLED
	; -DHW_SERIAL_NONE
build_src_filter = +<servo/*> +<core/*> -<.git/>
monitor_dtr = 1
monitor_rts = 1
monitor_port = /dev/cu./dev/cu.usbmodem8434203
monitor_speed = 115200

[env:io_v10]
; IO module v1.0 uses STM32C092GCU6
build_type = debug
platform = ststm32
board = stm32c092gcu6
board_build.ldscript = boards/stm32c092gcu6_ldscript.ld
platform_packages = 
	tool-openocd@symlink://packages/xpack-openocd-0.12.0-7
	platformio/tool-cppcheck@^1.21100.241030
framework = arduino
upload_protocol = stlink
lib_deps = 
build_flags = 
	-Os
	-specs=nano.specs
	-DMODULE_VERSION=10
	-DMODULE_HW_ID=0x88
	-DMODULE_ADDR_PIN_0=PB3
	-DMODULE_ADDR_PIN_1=PB4
	-DMODULE_I2C_SCL=PB8
	-DMODULE_I2C_SDA=PB7
	-DMODULE_CHANNELS=4
	-DIO_PINS='{PB1, PB0, PA7, PA6}'
	-DLED_PINS='{PA5, PA4, PA3, PA2}'
	-DIO_1_PIN=PB1
	-DIO_2_PIN=PB0
	-DIO_3_PIN=PA7
	-DIO_4_PIN=PA6
	-DLED_1_PIN=PA5
	-DLED_2_PIN=PA4
	-DLED_3_PIN=PA3
	-DLED_4_PIN=PA2
	-DMODULE_RX_PIN=PA1
	-DMODULE_TX_PIN=PA0
	-DCONFIG_UART_DEBUG=0
	-D HAL_SPI_MODULE_DISABLED
	-D HAL_ADC_MODULE_DISABLED
	-D HAL_RTC_MODULE_DISABLED
	-D HAL_DAC_MODULE_DISABLED
	-D HAL_EXTI_MODULE_DISABLED
monitor_dtr = 1
monitor_rts = 1
monitor_port = /dev/cu./dev/cu.usbmodem8434203
monitor_speed = 115200

