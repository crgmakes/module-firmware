	-specs=nano.specs
	-DMODULE_VERSION=11
	-DMODULE_HW_ID=0x88
	-DMODULE_ADDR_PIN_0=PB3
	-DMODULE_ADDR_PIN_1=PB4
	-DMODULE_I2C_SCL=PB8
	-DMODULE_I2C_SDA=PB7
	-DMODULE_CHANNELS=4
	-DIO_PINS='{PB1, PB0, PA7, PA6}'
	-DLED_PINS='{PA5, PA4, PA3, PA2}'
	-DMODULE_CHANNELS=4
	-DIO_PINS='{PB1, PB0, PA7, PA6}'
	-DLED_PINS='{PA5, PA4, PA3, PA2}'
	-DIO_1_PIN=PB1
	-DIO_2_PIN=PB0
